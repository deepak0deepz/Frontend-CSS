<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Netflix</title>

<style>

body{
    background-color:black;
    font-family: Arial, Helvetica, sans-serif;
    height:100vh;
    overflow:hidden;
}

header{
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:20px 40px;
    position:absolute;
    width:100%;
    box-sizing:border-box;
}

.logo{
    color:#e50914;
    font-size:32px;
    font-weight:bold;
}

.signin{
    background:#e50914;
    color:white;
    border:none;
    padding:8px 16px;
    border-radius:4px;
    cursor:pointer;
}



main{
    height:90vh;
    width:100%;
    background-image:linear-gradient(rgba(9, 9, 9, 0.6),rgba(0,0,0,0.6)),url("img/netflix.jpg");
    background-size:cover;
    background-position:center;
    background-repeat:no-repeat;
    background-attachment: fixed;

    display:flex;
    justify-content:center;
    align-items:center;
    text-align:center;
    color:white;
}


.hero h1{
    font-size:50px;
    margin:10px 0;
}

.hero h3{
    font-size:20px;
    font-weight:normal;
}



.email-box{
    margin-top:20px;
}

.email-box input{
    padding:12px;
    width:280px;
    border:none;
}

.email-box button{
    padding:12px 20px;
    background:#e50914;
    color:white;
    border:none;
    font-weight:bold;
    cursor:pointer;
}

.small{
    margin-top:10px;
    font-size:14px;
}
.right{
    display:flex;
    align-items:center;
    gap:15px;
}

.lang{
    color:white;
    font-weight:normal;
}

</style>
</head>

<body>

<header>
    <div class="logo">NETFLIX</div>

    <div class="right">
        <h3 class="lang">English</h3>
        <button class="signin">Sign In</button>
    </div>
</header>

<main>
    <div class="hero">
        <h1>Unlimited movies, TV</h1>
        <h1>shows and more.</h1>
        <h3>Watch anywhere. Cancel anytime.</h3>

        <div class="email-box">
            <input type="text" placeholder="Email address">
            <button>TRY IT NOW ></button>
        </div>

        <div class="small">
            Ready to watch? Enter your email to create or restart your membership.
        </div>
    </div>
</main>

</body>
</html>
