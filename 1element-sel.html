    def rec_pal(n, temp, res):
        if n <= 0:
            return temp == res
        rem = n % 10
        res = (res * 10) + rem
        n //= 10
        return rec_pal(n, temp, res)

    data = int(input())
    print(rec_pal(data, data, 0))
