<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Profile Card</title>
<style>
    

body{
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background:#d0e7f8;
}

.card{
    width:300px;
    background:white;
    border-radius:20px;
    padding:18px;
    box-shadow:0 10px 25px rgba(0,0,0,0.08);
}

.profile-img{
    width:100%;
    border-radius:16px;
}

h2{
    margin-top:12px;
    font-size:18px;
    display:flex;
    align-items:center;
    gap:6px;
}


.desc{
    font-size:13px;
    color:#777;
    margin:8px 0 15px 0;
}



.follow{
    background:#f0f1a0;
    border:none;
    padding:8px 14px;
    border-radius:20px;
    cursor:pointer;
    font-size:13px;
}

.follow:hover{
    background:#e5e5e5;
}
.card{
    border: 1px rgb(69, 59, 78) solid;
}
</style>
</head>
<body>

<div class="card">
    <img src="img/DS7_0042.JPG" class="profile-img">

    <h2>
        Deepak C S
    </h2>

    <p class="desc">
        Software Engineer and Artist who focuses on creativity, simplicity, and innovative design.
    </p>


       <a href="https://www.instagram.com/deepak_.cs/" target="_blank">
    <button class="follow">Follow +</button>
</a>
    </div>
</div>

</body>
</html>
