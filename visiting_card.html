<!DOCTYPE html>
<html>
<head>
<title>Business Card</title>

<style>

body{
    background:#d8d4cf;
    font-family:Arial, sans-serif;
}

.card{
    width:650px;
    height:260px;
    background:#f5f3f0;
    margin:120px auto;
    border-radius:6px;
    box-shadow:0 6px 18px rgba(0,0,0,0.25);
    display:flex;
}



.left{
    width:50%;
    text-align:center;
    padding:20px;
}

.scan{
    font-size:14px;
    letter-spacing:2px;
    margin-bottom:10px;
}

.qr{
    width:180px;
}



.divider{
    width:2px;
    background:#aaa;
    margin-top:20px;
    margin-bottom:20px;
}



.right{
    width:50%;
    padding:25px;
}

.name{
    font-size:18px;
    letter-spacing:3px;
}

.company{
    margin-top:5px;
    font-size:13px;
    letter-spacing:2px;
}

.address{
    margin-top:25px;
    font-size:13px;
    line-height:22px;
}

.connect{
    margin-top:25px;
    letter-spacing:2px;
}

.icons{
    margin-top:10px;
}

.icons span{
    width:32px;
    height:32px;
    border:1px solid #555;
    border-radius:50%;
    display:inline-flex;
    align-items:center;
    justify-content:center;
    margin-right:10px;
    font-size:14px;
}

</style>
</head>

<body>

<div class="card">

<div class="left">

<div class="scan">SCAN TO VISIT profile:</div>

<img src="img/qrcode_www.instagram.com.png" class="qr">

</div>

<div class="divider"></div>

<div class="right">

<div class="name">Deepak C S</div>
<div class="company">DCL</div>

<div class="address">
#14 2nd main road,<br>
Bengauru 8310267353<br>
EMAIL: deepakcs2k4@gmail.com<br>

</div>

<div class="connect">CONNECT WITH US:</div>

<div class="icons">
<span>ig</span>
<span>fb</span>
<span>x</span>
<span>pin</span>
</div>

</div>

</div>

</body>
</html>
