<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body{
            background-color: rgb(255, 255, 255);
            
        }
        .oo{
            height: 100vh;
            width: 1600px;
            display: flex;
            justify-content:center;
            align-content: center;
        }
        .o{
            height: 300px;
            width: 300px;
            background-color: rgb(255, 217, 121);
            position: relative;
            top:250px;
            animation: animi 10s infinite;
        }
        @keyframes animi {
            0%{background-color: rgb(255, 0, 242);border-radius: 0%;font-size: 0;}
             25%{background: url('img/batman1.jpg') center/cover no-repeat ;border-radius: 50%;font-size: 0;}
              50%{background: url('img/batman.jpg') center/cover no-repeat ;border-radius: 0%;font-size: 0;}
               75%{background-color: rgb(255, 0, 0);border-radius: 50%;color: white;font-size: 24px;font-weight: bold;         
        font-family: Arial, sans-serif; text-align: center; line-height: 300px; }
                100%{background-color: rgb(0, 0, 0);border-radius: 20%;font-size: 0; }
            
        }
    </style>
</head>
<body>
    <div class="oo">
    <div class="o">BATMAN</div>
    </div>
</body>
</html>
