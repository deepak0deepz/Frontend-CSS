<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Island+Moments&family=Rubik+Dirt&family=Sirin+Stencil&display=swap');
        @import url('https://fonts.googleapis.com/css2?family=Eagle+Lake&family=Island+Moments&family=Rubik+Dirt&family=Sirin+Stencil&display=swap');
        @import url('https://fonts.googleapis.com/css2?family=Anek+Kannada:wght@100..800&display=swap');
        #one{
            font-size: 50px;
            font-family: "Island Moments", cursive;
            color: rgb(230, 119, 8);
            border: 5px solid rgb(21, 255, 0); 
            border-radius: 10px;
        }
        #two{
            font-size: 5rem;
            font-family: "Eagle Lake", serif;
            color: rgb(45, 8, 230);
            border: 5px solid rgb(225, 0, 255); 
            border-radius: 10px 50px 60px 50px;

        }
        #three{
            font-size: 250%;
            font-style:italic;
            color: rgb(230, 8, 8);
            border: 5px solid rgb(255, 247, 0); 
            border-radius: 70px 10px 60px 10px;
        }
        #four{
            font-size: 3em;
            font-family: "Anek Kannada", sans-serif;
            color: rgb(230, 8, 8);
            margin: 30px;
            border: 5px solid rgb(255, 247, 0); 
            border-radius: 30px 5px 205px 15px;
            outline: 2px solid;
            outline-offset: 9px;
    
        }
        #imgg{
            border: 5px solid rgb(0, 157, 255);
            outline: 15px dashed rgb(165, 42, 42);
            outline-offset: 13px;
        }
    </style>
</head>
<body>
    <b id="one">Deepak C S</b>
    <BR><br><BR>
    <b id="two">Deepak C S</b>
    <BR><br><BR>
    <B id="three">Deepak C S  </B>

    <br><br><br><br>
    <center>         
    <img id="imgg" src="img/The Batman – A Darker Dawn of Justice.jpg">
    </center>
    <br><br><br>
