<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Green Bridge Login</title>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap');

        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:'Poppins',sans-serif;
        }

        body{
            height:100vh;
            display:flex;
            justify-content:center;
            align-items:center;
            background:linear-gradient(135deg,#141e30,#243b55);
        }

        .container{
            display:flex;
            width:750px;
            height:420px;
            border-radius:20px;
            overflow:hidden;
            box-shadow:0 15px 40px rgba(0,0,0,0.4);
        }

        /* LEFT SIDE */
        .left{
            flex:1;
            background:linear-gradient(135deg,#00c9ff,#92fe9d);
            color:#000;
            display:flex;
            flex-direction:column;
            justify-content:center;
            align-items:center;
            text-align:center;
            padding:20px;
        }

        .left h1{
            font-size:38px;
            margin-bottom:10px;
        }

        .left p{
            font-size:14px;
        }

        /* RIGHT SIDE */
        .right{
            flex:1;
            background:rgba(255,255,255,0.08);
            backdrop-filter:blur(15px);
            display:flex;
            justify-content:center;
            align-items:center;
        }

        form{
            width:80%;
            color:white;
        }

        form h2{
            text-align:center;
            margin-bottom:20px;
        }

        .input-box{
            margin-bottom:15px;
        }

        .input-box label{
            display:block;
            margin-bottom:5px;
            font-size:14px;
        }

        .input-box input{
            width:100%;
            padding:10px;
            border:none;
            border-radius:8px;
            outline:none;
        }

        .forgot{
            font-size:12px;
            text-align:right;
            margin-bottom:15px;
        }

        .forgot a{
            color:#ffd369;
            text-decoration:none;
        }

        button{
            width:100%;
            padding:10px;
            border:none;
            border-radius:10px;
            background:linear-gradient(45deg,#ff9a9e,#fad0c4);
            color:black;
            font-weight:bold;
            cursor:pointer;
            transition:0.3s;
        }

        button:hover{
            transform:scale(1.05);
        }

        .signup{
            text-align:center;
            margin-top:15px;
            font-size:13px;
        }

        .signup a{
            color:#ffd369;
            text-decoration:none;
        }

        /* RESPONSIVE */
        @media(max-width:600px){
            .container{
                flex-direction:column;
                height:auto;
                width:90%;
            }
        }

        @media(min-width:600px) and (max-width:768){
            .container{
                flex-direction:row;
                height:auto;
                width:90%;
            }
        }
    </style>
</head>

<body>

<div class="container">

    <div class="left">
        <h1>Green Bridge</h1>
        <p>Smart Agriculture Platform</p>
    </div>

    <div class="right">
        <form>
            <h2>Login</h2>

            <div class="input-box">
                <label>Username</label>
                <input type="text" placeholder="Enter username">
            </div>

            <div class="input-box">
                <label>Password</label>
                <input type="password" placeholder="Enter password">
            </div>

            <div class="forgot">
                <a href="#">Forgot Password?</a>
            </div>

            <button type="submit">Login</button>

            <div class="signup">
                Don't have an account? <a href="#">Sign Up</a>
            </div>
        </form>
    </div>

</div>

</body>
</html>
